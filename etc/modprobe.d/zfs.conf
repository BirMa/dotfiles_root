# ZFS tuning
# Batch TXGs at least every Xs instead of default at least every 5s to let NVMe drives idle (APST PS3/PS4).
# Trade-off: up to ~Xs of async writes lost on crash/power-loss (accepted).
# And (important): If a scrub/resilver was interrupted by a previous shutdown and is now resuming/in progress at boot,
# the root pool import can take ~2*Xs!
# options zfs zfs_txg_timeout=120 # Let's not, set once we're in userspace via tmpfiles to avoid this
