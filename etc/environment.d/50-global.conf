# Global environment for all users (see environment.d(5)).
# Read by the systemd user manager at login (-> services, D-Bus-activated apps),
# and by login shells via /etc/profile.d/00-environment-d.sh.
# Only KEY=VALUE with ${VAR} / ${VAR:-default} expansion; anything computed
# stays in /etc/profile.d/global_environment.sh.

# XDG base dirs (see https://github.com/woegjiub/.config/blob/master/bash/xdg.sh)
XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
#XDG_DATA_DIRS=${HOME}/.local/share
XDG_CACHE_HOME=${HOME}/.cache
XDG_STATE_HOME=${HOME}/.local/state

# XDG user dirs (Desktop, Documents, ...) are set per user in ~/.config/user-dirs.dirs (xdg-user-dirs).

# PATH: one line per modification, applied top to bottom.
# prepend
PATH=${HOME}/.local/bin:${PATH}
PATH=${HOME}/bin:${PATH}
# append
PATH=${PATH}:${HOME}/repos/go_packages/bin
#PATH=${PATH}:${HOME}/.gem/ruby/2.4.0/bin

# Socket of the packaged ssh-agent.socket user unit (enabled globally); ssh clients find the agent only via this.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# so far only ranger uses this.
TERMCMD=kitty
# so pacdiff uses nvim
DIFFPROG="nvim -d "
EDITOR="nvim -p "
# why wouldn't I want colors in less?
LESS=-RSMsi

# prevents certain systemcalls (https://blog.packagecloud.io/eng/2017/02/21/set-environment-variable-save-thousands-of-system-calls/)
# only downside could be that you can't change timezone mid-application, since the timezone is cached after the first read of /etc/localtime.
#TZ=:/etc/localtime

GOPATH=${HOME}/repos/go_packages/:${HOME}/sonstige/projects/coding_go/

# To make qt apps look more like gtk.
#QT_STYLE_OVERRIDE=gtk
# Supposed to make qt apps use the in qt6ct configured icon theme.
QT_QPA_PLATFORMTHEME=qt6ct
# TODO: check if this fixes some firefox dev-tools scroll overlap issues
GTK_OVERLAY_SCROLLING=0
# GTK3 apps use the xdg-desktop-portal file chooser; Firefox's default
# ("auto" mode of widget.use-xdg-desktop-portal.file-picker) checks it too, as far as I know.
# (GTK4 replaced it with GDK_DEBUG=portals, deliberately not set.)
GTK_USE_PORTAL=1

# Programs that default to $HOME, moved to XDG dirs
ZDOTDIR=${XDG_CONFIG_HOME}/zsh
#MPLAYER_HOME=${XDG_CONFIG_HOME}/mplayer
GEM_HOME=${HOME}/.local/lib/gems
GEM_SPEC_CACHE=${XDG_CACHE_HOME}/gem
GNUPGHOME=${XDG_CONFIG_HOME}/gnupg
GSTREGISTRY=${XDG_DATA_HOME}/gstreamer/registry.bin
GTK2_RC_FILES=${XDG_CONFIG_HOME}/gtk-2.0/gtkrc
# Bad idea, my inputrc is in /etc/ and that's fine.
#INPUTRC=${XDG_CONFIG_HOME}/readline/inputrc
IPYTHONDIR=${XDG_CONFIG_HOME}/ipython
PYLINTRC=${XDG_CONFIG_HOME}/pylint/pylintrc
PYTHONSTARTUP=${XDG_CONFIG_HOME}/python/pythonrc
KDEHOME=${XDG_CONFIG_HOME}/kde
NPM_CONFIG_USERCONFIG=${XDG_CONFIG_HOME}/npm/npmrc
#PASSWORD_STORE_DIR=${XDG_DATA_HOME}/password-store
#TERMINFO=${XDG_CONFIG_HOME}/terminfo
VAGRANT_HOME=${XDG_DATA_HOME}/vagrant
XAUTHORITY=${XDG_DATA_HOME}/Xauthority
WINEPREFIX=${XDG_DATA_HOME}/wine
CARGO_HOME=${XDG_DATA_HOME}/cargo
CUDA_CACHE_PATH=${XDG_CACHE_HOME}/nv
CLAUDE_CONFIG_DIR=${XDG_CONFIG_HOME}/claude
# asp folders
ASPROOT=${XDG_CONFIG_HOME}/asp
ASPCACHE=${XDG_CACHE_HOME}/asp

# bash history (bash picks these up from the environment)
HISTFILE=${XDG_DATA_HOME}/bash/history
HISTCONTROL=ignoredups:ignorespace
HISTSIZE=100000
HISTFILESIZE=600000

# prevent wine setup from messing up my file type associations
WINEDLLOVERRIDES=winemenubuilder.exe=d
# disable dotnet cli tool telemetry, whatever that means...
DOTNET_CLI_TELEMETRY_OPTOUT=1

# neovim-gtk is a gtk3 app
NVIM_GTK_NO_HEADERBAR=1
NVIM_GTK_PREFER_DARK_THEME=1

# nnn
NNN_SHOW_HIDDEN=1
NNN_TRASH=1

# colored GCC warnings and errors
GCC_COLORS="error=01;31:warning=01;35:note=01;36:caret=01;32:locus=01:quote=01"

# amount of parallel jobs: safe default for non-shell contexts;
# login shells override it with nproc in /etc/profile.d/global_environment.sh
JOBNUMBER=16
MAKEFLAGS=-j${JOBNUMBER}

# Intellij default config folder is in $HOME, fix that.
PYCHARM_PROPERTIES=${HOME}/etc/pycharm.properties
IDEA_PROPERTIES=${HOME}/etc/idea.properties
# Same with android-studio as with Intellij.
STUDIO_PROPERTIES=${HOME}/etc/android-studio.properties
# Android sdk location
ANDROID_HOME=${HOME}/repos/android-sdk

# aledgedly reduces scroll speed, but doesn't really do anything... needs more testing
CLAUDE_CODE_SCROLL_SPEED=1
