# Raise txg timeout only after the root pool is imported (see /etc/modprobe.d/zfs.conf)
# If we set this in /etc/modprobe.conf / modprobe.d/... we'll set it instantly during boot via initrd.
# And that means if a scrub/resilver was interrupted by a previous shutdown and is now resuming/in progress at boot,
# the root pool import can take ~2*Xs! So only set to this crazy slow value once we're in userspace.
w /sys/module/zfs/parameters/zfs_txg_timeout - - - - 120
